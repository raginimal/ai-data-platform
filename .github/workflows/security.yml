name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Gate 3 - Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency scanner
        run: python -m pip install pip-audit
      - name: Run repository security checks
        run: bash scripts/security-check.sh
      - name: Dependency and SAST overlay hook
        env:
          DEPENDENCY_SCANNER: scripts/dependency-scan.sh
        run: bash scripts/validate-optional-assets.sh
      - name: Container and IaC overlay hook
        run: echo "Conditional container and IaC checks are handled by the optional asset validator."
