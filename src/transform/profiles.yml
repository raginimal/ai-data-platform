data_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../../data/dev.duckdb') }}"
      threads: 1
    test:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../../data/test.duckdb') }}"
      threads: 1
    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../../data/prod.duckdb') }}"
      threads: 1
